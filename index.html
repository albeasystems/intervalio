<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intervalio</title>
    <meta name="description" content="Intervalio: interval timer for iPhone. Temporizador de intervalos para iPhone." />
    <meta name="theme-color" content="#0b0a0a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      html { background: #0b0a0a; color: #f4f1ee; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 22%; }
      h1 { margin: 20px 0 28px; font-size: 1.5rem; letter-spacing: -0.02em; }
      nav { display: flex; gap: 12px; justify-content: center; }
      a { color: #160d0a; background: #e8593c; padding: 12px 22px; border-radius: 999px; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #f4f1ee; outline-offset: 3px; }
    </style>
    <script>
      // Send visitors to the page in their language; both links below work without JavaScript.
      var spanish = (navigator.language || '').toLowerCase().indexOf('es') === 0
      location.replace(spanish ? './es/index.html' : './en/index.html')
    </script>
  </head>
  <body>
    <main>
      <img src="./icon.png" alt="" width="72" height="72" />
      <h1>Intervalio</h1>
      <nav>
        <a href="./en/index.html" hreflang="en" lang="en">English</a>
        <a href="./es/index.html" hreflang="es" lang="es">Español</a>
      </nav>
    </main>
  </body>
</html>
